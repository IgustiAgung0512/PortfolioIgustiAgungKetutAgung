<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Ultra Dark Tech Luxury -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Electric Blue Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Radiant Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Dark Squircle -->
  <rect x="20" y="20" width="472" height="472" rx="124" fill="url(#bg)"/>
  
  <!-- Subtle Ambient Glow Orbs behind logo -->
  <circle cx="150" cy="180" r="100" fill="#3b82f6" opacity="0.22" filter="url(#glow)"/>
  <circle cx="360" cy="330" r="90" fill="#f59e0b" opacity="0.18" filter="url(#glow)"/>

  <!-- High-Tech Glass Outer Border -->
  <rect x="20" y="20" width="472" height="472" rx="124" fill="none" stroke="url(#borderGrad)" stroke-width="8"/>

  <!-- Developer Code Bracket: Left "<" (Cyan to Royal Blue) -->
  <path d="M 165 170 
           L 95 256 
           L 165 342" 
        fill="none" 
        stroke="url(#blueGrad)" 
        stroke-width="36" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#shadow)"/>

  <!-- Developer Code Bracket: Right ">" (Gold / Amber) -->
  <path d="M 347 170 
           L 417 256 
           L 347 342" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="36" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#shadow)"/>

  <!-- Central Dynamic "A" Monogram (Pure White & Gold Core) -->
  <g filter="url(#shadow)">
    <!-- Main A Shape: Left Leg & Apex -->
    <path d="M 256 128 
             L 190 355 
             L 232 355 
             L 247 298 
             L 265 298 
             L 280 355 
             L 322 355 
             L 256 128 Z 
             M 256 195 
             L 261 262 
             L 251 262 Z" 
          fill="#ffffff"/>

    <!-- Central Glowing Core Slash / A-Bar (Gold Gradient) -->
    <rect x="220" y="272" width="72" height="24" rx="6" fill="url(#goldGrad)" filter="url(#glow)"/>

    <!-- Top Crown Sparkle / Star Diamond -->
    <polygon points="256,70 264,92 286,100 264,108 256,130 248,108 226,100 248,92" fill="url(#goldGrad)"/>
  </g>
</svg>
